<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qwfn · sign in</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/logo-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/img/logo-192x192.png">
<link rel="apple-touch-icon" href="/img/logo-180x180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Mulish:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/console.css">
</head>
<body>
<div class="auth">
  <div class="card">
    <div class="brand"><img src="/img/logo-192x192.png" width="112" height="112" alt="cakescats"><h1>qwfn console</h1></div>
    <p id="lead">Sign in to manage the model server.</p>
    <form id="f" autocomplete="on">
      <label>Login<input id="login" name="username" autocomplete="username" required maxlength="64" autofocus></label>
      <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <label id="rep" hidden>Repeat the password<input id="password2" type="password" autocomplete="new-password"></label>
      <label id="codebox" hidden>Setup code (printed in the console's terminal)<input id="code" autocomplete="off"></label>
      <label class="check"><input type="checkbox" id="remember"> Remember me for 30 days</label>
      <button type="submit" id="go">Sign in</button>
      <div class="err" id="err"></div>
    </form>
    <span class="langs" id="langs"><a href="/lang/ru" data-lang="ru" title="Русский"><svg viewBox="0 0 9 6" shape-rendering="crispEdges"><rect width="9" height="2" fill="#fff"/><rect y="2" width="9" height="2" fill="#0039a6"/><rect y="4" width="9" height="2" fill="#d52b1e"/></svg></a><a href="/lang/en" data-lang="en" title="English"><svg viewBox="0 0 60 30"><clipPath id="ukt"><path d="M30,15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath><path d="M0,0v30h60v-30z" fill="#012169"/><path d="M0,0L60,30M60,0L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0L60,30M60,0L0,30" clip-path="url(#ukt)" stroke="#C8102E" stroke-width="4"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></svg></a></span>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let setup = false;
(async () => {
  const s = await (await fetch('/api/authstate', { cache: 'no-store' })).json();
  if (s.signed_in) { location.href = '/'; return; }
  document.querySelectorAll('#langs a').forEach(a => a.classList.toggle('on', a.dataset.lang === s.lang));
  if (s.setup) {
    setup = true;
    $('lead').textContent = 'First run: create the account that will manage this console. At least 8 characters for the password.';
    $('go').textContent = 'Create account'; $('rep').hidden = false; $('password').autocomplete = 'new-password'; $('codebox').hidden = s.local;
  }
})();
$('f').onsubmit = async e => {
  e.preventDefault(); $('err').textContent = '';
  if (setup && $('password').value !== $('password2').value) { $('err').textContent = 'the passwords do not match'; return; }
  $('go').disabled = true;
  try {
    const r = await fetch(setup ? '/api/setup' : '/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Qwfn': '1' }, credentials: 'same-origin',
      body: JSON.stringify({ login: $('login').value.trim(), password: $('password').value, remember: $('remember').checked, code: $('code').value.trim() }) });
    const j = await r.json();
    if (j.ok) { location.href = '/'; return; }
    $('err').textContent = j.error || ('HTTP ' + r.status);
  } catch (x) { $('err').textContent = String(x); }
  $('go').disabled = false;
};
</script>
</body>
</html>
