# Example drop-in for qwfn-console.service: the console starts the model server from another
# build, or through a wrapper (scripts/qwfn-server-wrapper.sh), instead of the repository's
# build/qwfn-server.
#
#   mkdir -p ~/.config/systemd/user/qwfn-console.service.d
#   cp scripts/qwfn-console-engine.conf ~/.config/systemd/user/qwfn-console.service.d/engine.conf
#   systemctl --user daemon-reload && systemctl --user restart qwfn-console
#
# Delete the file, daemon-reload and restart to go back to build/qwfn-server.
# `systemctl --user cat qwfn-console` shows the unit with its drop-ins.
[Service]
Environment=QWFN_SERVER=%h/qwfn-server-wrapper.sh
# Locked host memory (QWFN_LOCK_HOST) needs memlock above the 8 MB default:
#LimitMEMLOCK=infinity
